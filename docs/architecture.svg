<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 840" width="1320" height="840" font-family="Helvetica,Arial,sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5058"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3ad"/></marker>
</defs>
<style>
  .band{fill:#f4f6f8}.bl{font-size:12.5px;fill:#5b636d;font-weight:bold;letter-spacing:.07em}
  .clk{font-size:11px;fill:#8b94a0}
  .box{fill:#fff;stroke:#2f3640;stroke-width:1.6;rx:7}
  .sim{fill:#fff;stroke:#8a5a00;stroke-width:1.6;stroke-dasharray:6 4;rx:7}
  .plan{fill:#fafafa;stroke:#9aa3ad;stroke-width:1.4;stroke-dasharray:2 4;rx:7}
  .core{fill:#eaf5ef;stroke:#1f6f4a;stroke-width:2.2;rx:7}
  .task{fill:#eef4fb;stroke:#2c5d8f;stroke-width:2;rx:7}
  .t{font-size:13px;fill:#16191d;font-weight:600}
  .s{font-size:11px;fill:#6b7280}
  .lk{font-size:10px;fill:#1f6f4a;font-weight:bold}
  .ln{stroke:#4a5058;stroke-width:1.6;fill:none;marker-end:url(#a)}
  .lng{stroke:#9aa3ad;stroke-width:1.4;fill:none;stroke-dasharray:3 3;marker-end:url(#ag)}
  .ctr{font-size:10.5px;fill:#2c5d8f;font-style:italic}
</style>

<text x="0" y="15" class="t" font-size="15">Shadow — architecture</text>
<text x="0" y="33" class="s">Bands are the three clocks. Everything the body can feel is local. Task feedback runs every rep; coaching waits to be asked.</text>
<rect class="box" x="760" y="4" width="16" height="13"/><text x="782" y="15" class="s">implemented</text>
<rect class="sim" x="890" y="4" width="16" height="13"/><text x="912" y="15" class="s">simulated placeholder</text>
<rect class="plan" x="1064" y="4" width="16" height="13"/><text x="1086" y="15" class="s">planned</text>

<!-- FRAME -->
<rect class="band" x="0" y="44" width="1320" height="178" rx="8"/>
<text x="16" y="70" class="bl">FRAME CLOCK</text><text x="16" y="88" class="clk">~11 ms · 90 Hz</text><text x="16" y="104" class="clk">always local</text>
<text x="16" y="126" class="clk">a swing is felt,</text><text x="16" y="142" class="clk">so none of this</text><text x="16" y="158" class="clk">may leave the device</text>

<rect class="sim" x="212" y="58" width="176" height="52"/><text x="226" y="80" class="t">Head + racket pose</text><text x="226" y="97" class="s">6DoF, 90 Hz</text>
<rect class="sim" x="212" y="120" width="176" height="46"/><text x="226" y="142" class="t">Room scan</text><text x="226" y="158" class="s">furniture positions</text>

<rect class="core" x="446" y="58" width="196" height="52"/><text x="460" y="80" class="t" fill="#1f6f4a">Reach remap</text><text x="460" y="97" class="s">real 2.1 m → virtual 2.86 m</text>
<rect class="box" x="446" y="120" width="196" height="46"/><text x="460" y="142" class="t">Collision fade-in</text><text x="460" y="158" class="s">passthrough as you near it</text>

<rect class="task" x="700" y="58" width="208" height="108"/>
<text x="714" y="82" class="t" fill="#2c5d8f">Shuttle flight + render</text>
<text x="714" y="100" class="s">quadratic drag, v_term 6.8 m/s</text>
<text x="714" y="116" class="s">launch ≈ 60 m/s</text>
<text x="714" y="134" class="s">arc, landing, verdict</text>
<text x="714" y="154" class="s" font-weight="bold" fill="#2c5d8f">TASK FEEDBACK — every rep</text>
<text x="926" y="96" class="ctr">This never waits to be asked.</text>
<text x="926" y="112" class="ctr">Where the shuttle went is the</text>
<text x="926" y="128" class="ctr">task, not a coaching opinion.</text>

<line class="ln" x1="388" y1="84" x2="440" y2="84"/>
<line class="ln" x1="388" y1="143" x2="440" y2="143"/>
<line class="ln" x1="642" y1="84" x2="694" y2="90"/>

<!-- INTERACTION -->
<rect class="band" x="0" y="234" width="1320" height="112" rx="8"/>
<text x="16" y="260" class="bl">INTERACTION CLOCK</text><text x="16" y="278" class="clk">~100 ms · local</text>
<rect class="box" x="212" y="250" width="176" height="52"/><text x="226" y="272" class="t">Contact extraction</text><text x="226" y="289" class="s">how far in front of the head</text>
<rect class="box" x="446" y="250" width="196" height="52"/><text x="460" y="272" class="t">Tracking-quality gate</text><text x="460" y="289" class="s">occluded → drop, never guess</text>
<rect class="core" x="700" y="250" width="208" height="52"/><text x="714" y="272" class="t" fill="#1f6f4a">Freeze the shuttle</text><text x="714" y="289" class="s">player presses P, any time</text>
<text x="926" y="276" class="ctr">player-triggered · the system may</text>
<text x="926" y="292" class="ctr">offer it after three misses, never take it</text>
<line class="ln" x1="388" y1="276" x2="440" y2="276"/>
<line class="ln" x1="642" y1="276" x2="694" y2="276"/>
<line class="ln" x1="300" y1="166" x2="300" y2="244"/>

<!-- BLOCK -->
<rect class="band" x="0" y="358" width="1320" height="196" rx="8"/>
<text x="16" y="384" class="bl">BLOCK CLOCK</text><text x="16" y="402" class="clk">seconds · local</text><text x="16" y="418" class="clk">end of 10 reps</text>
<rect class="box" x="212" y="376" width="176" height="68"/><text x="226" y="398" class="t">Misses vs your own</text><text x="226" y="415" class="s">reps that landed</text><text x="226" y="431" class="s">never vs an expert</text>
<rect class="core" x="446" y="370" width="262" height="112"/>
<text x="462" y="394" class="t" fill="#1f6f4a">POLICY ENGINE</text>
<text x="462" y="412" class="s">hysteresis: enter .60 × 2 blocks</text>
<text x="462" y="428" class="s">leave .35 × 3 blocks</text>
<text x="462" y="444" class="s">dormant→arming→active→muted</text>
<text x="462" y="464" class="lk">decides only whether to OFFER</text>
<rect class="box" x="766" y="370" width="186" height="50"/><text x="780" y="392" class="t">Offer one line</text><text x="780" y="409" class="s">between reps, ignorable</text>
<text x="962" y="396" class="ctr">advise</text>
<rect class="box" x="766" y="432" width="186" height="50"/><text x="780" y="454" class="t">Stay quiet</text><text x="780" y="471" class="s">a defined state</text>
<rect class="box" x="446" y="496" width="262" height="44"/><text x="460" y="518" class="t">Trace</text><text x="460" y="533" class="s">from return values, not a summary</text>
<line class="ln" x1="388" y1="408" x2="440" y2="412"/>
<line class="ln" x1="708" y1="396" x2="760" y2="396"/><line class="ln" x1="708" y1="452" x2="760" y2="456"/>
<line class="ln" x1="577" y1="482" x2="577" y2="490"/>
<line class="ln" x1="544" y1="302" x2="544" y2="364"/>

<!-- PULLED -->
<rect class="band" x="0" y="566" width="1320" height="222" rx="8"/>
<text x="16" y="592" class="bl">PULLED BY</text><text x="16" y="610" class="bl">THE PLAYER</text><text x="16" y="630" class="clk">no deadline</text><text x="16" y="646" class="clk">never gated by</text><text x="16" y="662" class="clk">the policy</text>

<rect class="core" x="212" y="586" width="196" height="92"/>
<text x="226" y="610" class="t" fill="#1f6f4a">"What happened?"</text><text x="226" y="628" class="s">one sentence, the reps</text><text x="226" y="644" class="s">behind it, plotted</text><text x="226" y="664" class="lk">implemented</text>
<text x="212" y="700" class="ctr">advise — the player asked</text>

<rect class="core" x="446" y="586" width="262" height="92"/>
<text x="462" y="610" class="t" fill="#1f6f4a">Override ladder</text>
<text x="462" y="628" class="s">1st: gone this block, silently</text>
<text x="462" y="644" class="s">2nd: muted for the session, said</text>
<text x="462" y="660" class="s">global: "don't offer, I'll ask"</text>
<text x="446" y="700" class="ctr">never self-reverts, however strong the evidence</text>

<rect class="core" x="766" y="586" width="186" height="92"/>
<text x="780" y="610" class="t" fill="#1f6f4a">Show me on court</text><text x="780" y="628" class="s">side view, the contact</text><text x="780" y="644" class="s">and the gap to ideal</text><text x="780" y="664" class="lk">implemented</text>

<rect class="box" x="1010" y="586" width="186" height="92"/>
<text x="1024" y="610" class="t">Coach surface</text><text x="1024" y="628" class="s">confidence, spread,</text><text x="1024" y="644" class="s">what was muted</text><text x="1024" y="664" class="lk">implemented</text>
<text x="1010" y="700" class="ctr">execute with approval — leaves the</text>
<text x="1010" y="716" class="ctr">headset and cannot be undone</text>

<rect class="plan" x="1010" y="370" width="186" height="112"/>
<text x="1024" y="394" class="t" fill="#6b7280">LLM phrasing</text><text x="1024" y="412" class="s">scored observation</text><text x="1024" y="428" class="s">→ sentence</text><text x="1024" y="444" class="s">beside the loop, remote</text><text x="1024" y="464" class="s" font-weight="bold">planned</text>
<text x="1010" y="500" class="ctr" fill="#9aa3ad">late or absent → keep the template</text>
<text x="1010" y="516" class="ctr" fill="#9aa3ad">sentence and show its age</text>
<line class="lng" x1="952" y1="420" x2="1004" y2="420"/>

<line class="ln" x1="408" y1="628" x2="440" y2="628"/>
<line class="ln" x1="708" y1="628" x2="760" y2="628"/>
<line class="ln" x1="952" y1="628" x2="1004" y2="628"/>
<line class="ln" x1="577" y1="540" x2="577" y2="580"/>
<line class="ln" x1="300" y1="444" x2="300" y2="580"/>

<text x="0" y="818" class="s" font-weight="bold">Nothing in the built system makes a remote call, so the "slowest call never returns" failure has nothing to handle. The only planned remote component is scoped so its absence degrades to the template sentence.</text>
</svg>
