<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" font-family="Helvetica,Arial,sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#37424d"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6f4a"/></marker>
<style>
.t{font-size:13px;fill:#16191d}.s{font-size:11px;fill:#5d6b78}.h{font-size:12.5px;font-weight:700;fill:#16191d}
.lane{font-size:11px;font-weight:700;fill:#8b949c;letter-spacing:.08em}
.box{fill:#fff;stroke:#c3ccd5;stroke-width:1.2;rx:7}
.sim{fill:#fdf6e6;stroke:#d8b25e}.plan{fill:#f4f5f7;stroke:#b9c0c8;stroke-dasharray:5 3}
.ai{fill:#eef4fb;stroke:#8fb4d9}
.ln{stroke:#37424d;stroke-width:1.4;fill:none;marker-end:url(#a)}
.lg{stroke:#1f6f4a;stroke-width:1.4;fill:none;marker-end:url(#ag)}
.lbl{font-size:10.5px;fill:#37424d}.lblg{font-size:10.5px;fill:#1f6f4a}
.grp{fill:none;stroke:#dfe3e8;stroke-width:1;rx:10}
</style></defs>

<text x="20" y="26" class="h" font-size="15">Shadow — architecture</text>
<text x="20" y="44" class="s">Solid = implemented and running. Amber = simulated stand-in for headset hardware. Dashed = planned, not built.</text>

<!-- clock lanes -->
<line x1="20" y1="60" x2="1160" y2="60" stroke="#e3e6ea"/>
<text x="24" y="80" class="lane">FRAME CLOCK  ~11 ms</text>
<text x="24" y="300" class="lane">INTERACTION CLOCK  ~100 ms</text>
<text x="24" y="520" class="lane">BLOCK CLOCK  seconds to minutes</text>
<line x1="20" y1="286" x2="1160" y2="286" stroke="#eef0f2" stroke-dasharray="4 4"/>
<line x1="20" y1="506" x2="1160" y2="506" stroke="#eef0f2" stroke-dasharray="4 4"/>

<!-- PHONE -->
<rect x="30" y="92" width="270" height="178" class="grp"/>
<text x="42" y="110" class="h">Phone — the racket</text>
<text x="42" y="126" class="s">Expo Go, SDK 58, React Native</text>
<rect x="42" y="136" width="120" height="44" class="box sim"/>
<text x="52" y="154" class="t">DeviceMotion</text><text x="52" y="169" class="s">60 Hz attitude</text>
<rect x="178" y="136" width="110" height="44" class="box"/>
<text x="188" y="154" class="t">Swing peak</text><text x="188" y="169" class="s">hysteresis</text>
<rect x="42" y="192" width="120" height="44" class="box"/>
<text x="52" y="210" class="t">Rest pose</text><text x="52" y="225" class="s">900 ms average</text>
<rect x="178" y="192" width="110" height="44" class="box"/>
<text x="188" y="210" class="t">Haptics</text><text x="188" y="225" class="s">one per meaning</text>
<text x="42" y="258" class="s">Stand-in for headset controller tracking.</text>

<!-- RELAY -->
<rect x="330" y="150" width="104" height="60" class="box"/>
<text x="342" y="174" class="t">Relay</text><text x="342" y="190" class="s">ws :4179, LAN</text>

<!-- COURT frame clock -->
<rect x="470" y="92" width="400" height="178" class="grp"/>
<text x="482" y="110" class="h">Court — virtual world generator</text>
<text x="482" y="126" class="s">three.js, browser. Stand-in for the headset.</text>
<rect x="482" y="136" width="120" height="44" class="box"/>
<text x="492" y="154" class="t">Attitude</text><text x="492" y="169" class="s">shaft + face</text>
<rect x="616" y="136" width="114" height="44" class="box"/>
<text x="626" y="154" class="t">Shuttle flight</text><text x="626" y="169" class="s">quadratic drag</text>
<rect x="744" y="136" width="112" height="44" class="box"/>
<text x="754" y="154" class="t">Render</text><text x="754" y="169" class="s">hall, shadow</text>
<rect x="482" y="192" width="120" height="44" class="box"/>
<text x="492" y="210" class="t">Strike volume</text><text x="492" y="225" class="s">reach, whiff</text>
<rect x="616" y="192" width="114" height="44" class="box"/>
<text x="626" y="210" class="t">Shot model</text><text x="626" y="225" class="s">face to launch</text>
<rect x="744" y="192" width="112" height="44" class="box"/>
<text x="754" y="210" class="t">Reach remap</text><text x="754" y="225" class="s">ceiling bound</text>

<!-- passthrough -->
<rect x="900" y="136" width="130" height="44" class="box sim"/>
<text x="910" y="154" class="t">Furniture fade</text><text x="910" y="169" class="s">passthrough proxy</text>
<rect x="900" y="192" width="130" height="44" class="box plan"/>
<text x="910" y="210" class="t">Headset + foot</text><text x="910" y="225" class="s">tracking (planned)</text>

<!-- INTERACTION clock -->
<rect x="330" y="312" width="300" height="170" class="grp"/>
<text x="342" y="330" class="h">Session gate</text>
<rect x="342" y="342" width="124" height="42" class="box"/>
<text x="352" y="359" class="t">Four steps</text><text x="352" y="374" class="s">link, hand, grip, start</text>
<rect x="482" y="342" width="136" height="42" class="box"/>
<text x="492" y="359" class="t">Rep loop</text><text x="492" y="374" class="s">feed, resolve, next</text>
<rect x="342" y="398" width="124" height="42" class="box"/>
<text x="352" y="415" class="t">Task feedback</text><text x="352" y="430" class="s">where it went</text>
<rect x="482" y="398" width="136" height="42" class="box"/>
<text x="492" y="415" class="t">Alerts</text><text x="492" y="430" class="s">screen + haptic</text>
<text x="342" y="462" class="s">Always on. This is the task, not a judgement.</text>

<rect x="670" y="312" width="360" height="170" class="grp"/>
<text x="682" y="330" class="h">Interaction contracts</text>
<rect x="682" y="342" width="160" height="42" class="box"/>
<text x="692" y="359" class="t">Advise / assist</text><text x="692" y="374" class="s">observations, ghost target</text>
<rect x="856" y="342" width="162" height="42" class="box"/>
<text x="866" y="359" class="t">Execute with approval</text><text x="866" y="374" class="s">share with coach</text>
<rect x="682" y="398" width="160" height="42" class="box"/>
<text x="692" y="415" class="t">Override ladder</text><text x="692" y="430" class="s">accept, mute, global</text>
<rect x="856" y="398" width="162" height="42" class="box"/>
<text x="866" y="415" class="t">Player freeze</text><text x="866" y="430" class="s">stop the shuttle, look</text>

<!-- BLOCK clock -->
<rect x="330" y="532" width="300" height="140" class="grp"/>
<text x="342" y="550" class="h">Augmented feedback — on request</text>
<rect x="342" y="562" width="124" height="42" class="box ai"/>
<text x="352" y="579" class="t">Analysis</text><text x="352" y="594" class="s">misses vs own hits</text>
<rect x="482" y="562" width="136" height="42" class="box ai"/>
<text x="492" y="579" class="t">Policy state</text><text x="492" y="594" class="s">hysteresis, confidence</text>
<text x="342" y="630" class="s">Intelligent behaviour lives here, off the frame loop.</text>
<text x="342" y="648" class="s">Never interrupts a rep; waits to be asked.</text>

<rect x="670" y="532" width="360" height="140" class="grp"/>
<text x="682" y="550" class="h">Surfaces</text>
<rect x="682" y="562" width="104" height="42" class="box"/>
<text x="692" y="579" class="t">Review</text><text x="692" y="594" class="s">player asks</text>
<rect x="800" y="562" width="104" height="42" class="box"/>
<text x="810" y="579" class="t">Coach</text><text x="810" y="594" class="s">after approval</text>
<rect x="918" y="562" width="100" height="42" class="box plan"/>
<text x="928" y="579" class="t">History</text><text x="928" y="594" class="s">(planned)</text>

<!-- arrows -->
<path class="ln" d="M300 166 L326 172"/><text x="300" y="150" class="lbl">frames 60 Hz</text>
<path class="ln" d="M300 212 L326 196"/><text x="296" y="238" class="lbl">swing + age</text>
<path class="ln" d="M434 172 L476 158"/><text x="436" y="146" class="lbl">forward</text>
<path class="lg" d="M434 190 L476 206" transform="translate(0,0)"/>
<path class="lg" d="M560 410 L440 196" stroke-dasharray="0"/>
<text x="470" y="300" class="lblg">contact, alert</text>
<path class="ln" d="M602 158 L612 158"/>
<path class="ln" d="M602 214 L612 214"/>
<path class="ln" d="M730 214 L740 214"/>
<path class="ln" d="M672 236 L600 338"/><text x="600" y="300" class="lbl">rep outcome</text>
<path class="ln" d="M404 482 L404 556"/><text x="410" y="522" class="lbl">block of 10</text>
<path class="ln" d="M618 583 L676 583"/>
<path class="ln" d="M786 562 L856 440"/><text x="792" y="510" class="lbl">approval</text>
<path class="ln" d="M762 398 L680 362" stroke-dasharray="3 3"/>
</svg>
